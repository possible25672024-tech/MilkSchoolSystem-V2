<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="milkapp-foundation" content="Sprint 4.0 Cutover Readiness and Compatibility">
    <title>MilkSchoolSystem V2</title>
    <link rel="icon" href="data:,">
    <style>
        :root {
            font-family: "Sarabun", system-ui, sans-serif;
            color: #1f2937;
            background: #eef3f8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        main {
            width: min(760px, 100%);
        }

        .panel {
            background: #ffffff;
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 18px 50px rgba(15, 46, 68, 0.14);
        }

        .auth-panel {
            width: min(460px, 100%);
            margin-inline: auto;
        }

        h1,
        h2 {
            margin: 0;
            color: #1a5276;
        }

        h1 {
            margin-bottom: 6px;
            font-size: 1.55rem;
        }

        h2 {
            font-size: 1.3rem;
        }

        .subtitle,
        .status,
        .eyebrow {
            color: #64748b;
            font-size: 0.9rem;
        }

        .eyebrow {
            margin: 0 0 4px;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        label {
            display: block;
            margin: 18px 0 6px;
            font-weight: 600;
        }

        select,
        input,
        button {
            width: 100%;
            min-height: 44px;
            border-radius: 9px;
            font: inherit;
        }

        select,
        input {
            border: 1px solid #cbd5e1;
            padding: 9px 12px;
            background: #ffffff;
        }

        button {
            margin-top: 20px;
            border: 0;
            padding: 10px 16px;
            color: #ffffff;
            background: #1a5276;
            font-weight: 700;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        .secondary {
            background: #475569;
        }

        .error {
            margin-top: 14px;
            padding: 10px 12px;
            border-radius: 8px;
            color: #991b1b;
            background: #fee2e2;
        }

        .status {
            min-height: 22px;
            margin-top: 12px;
        }

        .teacher-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 18px;
        }

        .teacher-school {
            margin: 8px 0 0;
            color: #475569;
        }

        .connection-badge {
            flex: 0 0 auto;
            padding: 7px 12px;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 700;
            color: #166534;
            background: #dcfce7;
        }

        .connection-badge[data-state="offline"] {
            color: #9a3412;
            background: #ffedd5;
        }

        .teacher-identity-grid,
        .teacher-metrics {
            display: grid;
            gap: 14px;
            margin-top: 22px;
        }

        .teacher-identity-grid {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .teacher-metrics {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .info-card,
        .metric-card {
            min-width: 0;
            margin: 0;
            border: 1px solid #dbe5ef;
            border-radius: 12px;
            padding: 16px;
            background: #f8fafc;
        }

        .info-card dt,
        .metric-label {
            margin: 0 0 6px;
            color: #64748b;
            font-size: 0.82rem;
            font-weight: 700;
        }

        .info-card dd,
        .metric-value {
            margin: 0;
            overflow-wrap: anywhere;
            color: #1f2937;
            font-size: 1.05rem;
            font-weight: 700;
        }

        .metric-card {
            background: #eef6fb;
        }

        .metric-value {
            color: #1a5276;
            font-size: 1.45rem;
        }

        .teacher-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 8px;
        }

        .teacher-actions button {
            width: min(220px, 100%);
        }

        [hidden] {
            display: none !important;
        }

        @media (max-width: 600px) {
            body {
                padding: 16px;
            }

            .panel {
                padding: 22px;
            }

            .teacher-header {
                align-items: stretch;
                flex-direction: column;
            }

            .connection-badge {
                align-self: flex-start;
            }

            .teacher-identity-grid,
            .teacher-metrics {
                grid-template-columns: 1fr;
            }

            .teacher-actions button {
                width: 100%;
            }
        }
    </style>

    <script defer src="config/app-config.js"></script>
    <script defer src="config/firebase-config.js"></script>
    <script defer src="modules/config/configManager.js"></script>

    <script defer src="modules/services/firebaseService.js"></script>
    <script defer src="modules/repositories/baseRepository.js"></script>
    <script defer src="modules/services/storageService.js"></script>
    <script defer src="modules/storage/queueStorage.js"></script>

    <script defer src="modules/repositories/loginRepository.js"></script>
    <script defer src="modules/repositories/stockRepository.js"></script>
    <script defer src="modules/repositories/reportRepository.js"></script>
    <script defer src="modules/repositories/roomRepository.js"></script>
    <script defer src="modules/repositories/teacherRepository.js"></script>
    <script defer src="modules/repositories/attendanceRepository.js"></script>

    <script defer src="modules/services/loginService.js"></script>
    <script defer src="modules/services/stockService.js"></script>
    <script defer src="modules/services/reportService.js"></script>
    <script defer src="modules/services/roomService.js"></script>
    <script defer src="modules/services/teacherService.js"></script>
    <script defer src="modules/services/attendanceService.js"></script>
    <script defer src="modules/services/syncService.js"></script>

    <script defer src="modules/login/authService.js"></script>
    <script defer src="modules/login/loginManager.js"></script>
    <script defer src="modules/stock/stockManager.js"></script>
    <script defer src="modules/report/reportManager.js"></script>
    <script defer src="modules/room/roomManager.js"></script>
    <script defer src="modules/teacher/teacherManager.js"></script>
    <script defer src="modules/attendance/attendanceManager.js"></script>
    <script defer src="modules/sync/syncManager.js"></script>
    <script defer src="modules/teacher/teacherView.js"></script>

    <script defer src="modules/core/app.js"></script>
    <script defer src="modules/core/bootstrap.js"></script>
</head>
<body>
    <main>
        <p id="bootstrap-error" class="error" hidden></p>

        <section id="login-panel" class="panel auth-panel">
            <h1>MilkSchoolSystem V2</h1>
            <p class="subtitle">เข้าสู่ระบบผู้ดูแลหรือครูประจำชั้น</p>

            <form id="login-form" novalidate>
                <label for="login-class-select">ห้องเรียน / บทบาท</label>
                <select id="login-class-select" required>
                    <option value="">-- เลือกห้องเรียน / บทบาท --</option>
                    <option value="__admin__">👑 ผู้ดูแลระบบ</option>
                </select>

                <label for="login-password">รหัสผ่าน</label>
                <input
                    id="login-password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="กรอกรหัสผ่าน"
                    required
                >

                <button id="login-submit" type="submit">เข้าสู่ระบบ</button>
                <button id="reload-login-options" class="secondary" type="button">โหลดห้องเรียนใหม่</button>

                <p id="login-status" class="status" aria-live="polite"></p>
                <p id="login-error" class="error" role="alert" hidden></p>
            </form>
        </section>

        <section id="app-panel" class="panel" hidden>
            <div id="admin-shell">
                <h1>เข้าสู่ระบบสำเร็จ</h1>
                <p id="current-user"></p>
                <p class="subtitle">Sprint 4.1 Teacher UI Shell and Read-Only State พร้อมสำหรับการตรวจสอบหน้าครูแบบอ่านอย่างเดียว</p>
                <button id="logout-button" class="secondary" type="button">ออกจากระบบ</button>
            </div>

            <section id="teacher-shell" aria-labelledby="teacher-shell-title" aria-busy="false" hidden>
                <header class="teacher-header">
                    <div>
                        <p class="eyebrow">MilkSchoolSystem V2 · หน้าครู</p>
                        <h2 id="teacher-shell-title">ข้อมูลห้องเรียน</h2>
                        <p id="teacher-school-name" class="teacher-school"></p>
                    </div>
                    <span id="teacher-connection-state" class="connection-badge" data-state="online">ออนไลน์</span>
                </header>

                <dl class="teacher-identity-grid">
                    <div class="info-card">
                        <dt>ห้องเรียน</dt>
                        <dd id="teacher-room-name">—</dd>
                    </div>
                    <div class="info-card">
                        <dt>ครูประจำชั้น</dt>
                        <dd id="teacher-name">—</dd>
                    </div>
                </dl>

                <div class="teacher-metrics">
                    <article class="metric-card">
                        <p class="metric-label">นมคงเหลือในห้อง</p>
                        <p id="teacher-room-stock" class="metric-value">—</p>
                    </article>
                    <article class="metric-card">
                        <p class="metric-label">รายการรอซิงก์</p>
                        <p id="teacher-queue-count" class="metric-value">0 รายการ</p>
                    </article>
                </div>

                <p id="teacher-shell-status" class="status" aria-live="polite"></p>
                <p id="teacher-shell-error" class="error" role="alert" hidden></p>

                <div class="teacher-actions">
                    <button id="teacher-logout-button" class="secondary" type="button">ออกจากระบบ</button>
                </div>
            </section>
        </section>
    </main>
</body>
</html>
